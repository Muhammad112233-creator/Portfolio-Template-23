<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" font-family="monospace">
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0%" stop-color="#ff004c">
        <animate attributeName="stop-color" values="#ff004c;#ff8a00;#ffee00;#00e676;#00b0ff;#b388ff;#ff004c" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00e676">
        <animate attributeName="stop-color" values="#00e676;#00b0ff;#b388ff;#ff004c;#ff8a00;#ffee00;#00e676" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00b0ff">
        <animate attributeName="stop-color" values="#00b0ff;#b388ff;#ff004c;#ff8a00;#ffee00;#00e676;#00b0ff" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1b1b22"/>
      <stop offset="100%" stop-color="#0b0b0c"/>
    </radialGradient>
  </defs>
  <rect width="880" height="240" fill="url(#glow)"/>
  <rect x="4" y="4" width="872" height="232" rx="14" fill="none" stroke="url(#rainbow)" stroke-width="3"/>
  <g fill="#ffffff">
    <circle cx="70" cy="48" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="30" r="1.2"><animate attributeName="opacity" values="1;0.15;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="52" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="34" r="1.3"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="50" r="1.7"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="810" cy="36" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="196" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="200" r="1.5"><animate attributeName="opacity" values="0.85;0.1;0.85" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>
  <text x="440" y="105" text-anchor="middle" font-size="52" font-weight="bold" fill="url(#rainbow)" letter-spacing="1">AlexOS ’96 → 2026</text>
  <text x="440" y="148" text-anchor="middle" font-size="17" fill="#8f8f96" letter-spacing="4">A PORTFOLIO THAT BOOTS IN 1996 AND UPDATES ITSELF TO 2026</text>
  <g>
    <rect x="330" y="170" width="220" height="34" rx="17" fill="none" stroke="url(#rainbow)" stroke-width="2"/>
    <text x="440" y="193" text-anchor="middle" font-size="15" fill="#c6ff3a">⚡ press ⟳ 2026 to time-travel
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
